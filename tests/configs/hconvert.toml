# Packages
#===========================================================
[packages]
host = "https://github.com/JepEtau/external_rehost/releases/download/external"
do_cache = false


# Windows
#-----------------------------------------------------------
# [packages.win32]
# do_cache = false

[packages.win32.python]
filename = "python-3.12.10-win-x86_64.tar.gz"
do_cache = true

[packages.win32.ffmpeg]
host = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-11-17-12-57/"
filename = "ffmpeg-N-121789-gddf443f1e9-win64-lgpl.zip"
do_cache = true

[packages.win32.vspython]
filename = "vspython.zip"
skip = true


# Linux
#-----------------------------------------------------------
[packages.linux.python]
filename = "python-3.12.12-linux-x86_64.tar.gz"
do_cache = true

[packages.linux.ffmpeg]
host = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-11-17-12-57/"
filename = "ffmpeg-N-121789-gddf443f1e9-linux64-lgpl.tar.xz"
do_cache = true


# Python packages
#===========================================================
[py_packages]
[py_packages.common]
pypi = [
# In python package, because critical or small
    # "websockets",
    # "hytils",
    "setuptools",
    "wheel",

# Upgradable
    # "hytils",
    "psutil",
    "nvidia-ml-py",
    "hsys",
    "opencv-python",
    "numpy",
    "timm",
#     "backend",
#     "pynnlib",
]


# Second pass
[py_packages.delayed]
do_cache = true

[py_packages.delayed.torch]
uninstall_before = true


# Safetensors
[py_packages.delayed.safetensors]
safetensors = "0.7.0"

# Onnx
[py_packages.delayed.onnx]
onnx = "1.19.1"
onnxruntime = "1.23.2"

# PyTorch
[py_packages.delayed.torch.cuda]
extra-index-url = "https://download.pytorch.org/whl/cu130"
torch = "2.9.1+cu130"
torchvision = "0.24.0+cu130"

[py_packages.delayed.torch.cpu]
extra-index-url = "https://download.pytorch.org/whl/cpu"
torch = "2.9.1+cpu"
torchvision = "0.24.0+cpu"

[py_packages.delayed.torch.rocm]
extra-index-url = "https://download.pytorch.org/whl/rocm6.4"
torch = "2.9.1+rocm6.4"
torchvision = "0.24.0+rocm6.4"

# Nvidia TensorRT
[py_packages.delayed.tensorrt]
# extra-index-url = "https://pypi.org/simple"
index-url = "https://pypi.nvidia.com"
# https://pypi.nvidia.com
# Cannot download with requests because build from source
tensorrt = "10.14.1.48.post1"

# tensorrt_cu13_libs==10.14.1.48.post1 (from tensorrt_cu13==10.14.1.48.post1->tensorrt)
#   Downloading https://pypi.nvidia.com/tensorrt-cu13-libs/tensorrt_cu13_libs-10.14.1.48.post1-py2.py3-none-win_amd64.whl (1628.8 MB)
# https://pypi.nvidia.com/tensorrt-cu13-libs/tensorrt_cu13_libs-10.14.1.48-py2.py3-none-win_amd64.whl
# https://pypi.nvidia.com
# https://pypi.nvidia.com/nvidia-cuda-runtime/

# tensorrt               10.14.1.48.post1
# tensorrt_cu13          10.14.1.48.post1
# tensorrt_cu13_bindings 10.14.1.48.post1
# tensorrt_cu13_libs     10.14.1.48.post1
# nvidia-cuda-runtime   13.0.88

# DirectML
[py_packages.delayed.directml]
onnxruntime-directml = "1.23.0"


# Other
#===========================================================
[packages.names]
ffmpeg = "FFmpeg"
vspython = "VS python"
avs = "AviSynth+ plugins"

[py_packages.names]
opencv-python = "OpenCV"
numpy = "NumPy"
nvidia-ml-py = "pyNVML"
timm = "TIMM"
onnx = "ONNX"
onnxruntime = "ONNX Runtime"
safetensors = "SafeTensors"
tensorrt = "TensorRT"
directml = "Direct ML"
torch = "PyTorch"
torch-cuda = "PyTorch (CUDA)"
torch-cpu = "PyTorch (CPU)"
torch-rocm = "PyTorch (ROCm)"
torchvision = "TorchVision"
onnxruntime-directml = "ONNX Runtime (Direct ML)"
